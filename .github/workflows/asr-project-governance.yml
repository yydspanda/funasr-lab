name: ASR Project Governance

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

concurrency:
  group: asr-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lightweight-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out full baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: requirements/lab-cpu.lock

      - name: Provision exact locked CPU lab runtime (no model download)
        run: |
          uv venv --python 3.11 .venv
          uv pip sync --python .venv/bin/python --torch-backend cpu \
            requirements/lab-cpu.lock
          .venv/bin/python scripts/asr_lab_doctor.py --strict-base-env

      - name: Validate Roadmap and Progress
        run: |
          python scripts/check_asr_progress.py
          python scripts/archive_asr_progress.py --check

      - name: Validate experiment manifests
        run: |
          git fetch --no-tags origin \
            +refs/heads/develop:refs/remotes/origin/develop
          python scripts/check_experiment_manifests.py \
            --code-ref refs/remotes/origin/develop

      - name: Run lab unit and sealed integration tests
        run: |
          .venv/bin/python -m unittest discover -s tests -p 'test_asr_lab_*.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_*_governance.py' -v

      - name: Compile governed Python surfaces
        run: >-
          python -m compileall -q
          asr_lab
          scripts
          eval
          tests/test_asr_lab_normalizer.py
          tests/test_asr_lab_smoke_entry.py
          tests/test_asr_progress_governance.py
          tests/test_experiment_manifest_governance.py
          tests/test_upstream_guard_governance.py

      - name: Reject whitespace errors
        run: git diff-tree --check -r HEAD
